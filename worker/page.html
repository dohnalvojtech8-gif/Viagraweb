const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:2,minimumFractionDigits:0}).format(n);const bag='<svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14l1 14H4L5 7Z M8 8V6a4 4 0 0 1 8 0v2"/></svg>';const leaf='<svg class="icon" viewBox="0 0 24 24"><path d="M19 4C5 2 2 12 7 17S22 16 19 4ZM5 21 16 9"/></svg>';let content={},currentUser=null,testMode=false;let products=[],isAdmin=false,category='Vše',sort='default',query='',adminTab='products',adminData={},cart=[];try{cart=JSON.parse(localStorage.getItem('doma-cart')||'[]');if(!Array.isArray(cart))cart=[]}catch{};let requestId=sessionStorage.getItem('doma-order-id')||crypto.randomUUID();
async function api(path,body){let r=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'Něco se nepodařilo.');return d}function toast(t){$('#toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toast').innerHTML='',3200)}function saveCart(){localStorage.setItem('doma-cart',JSON.stringify(cart));$('#count').textContent=cart.reduce((n,i)=>n+i.qty,0);requestId=crypto.randomUUID();sessionStorage.setItem('doma-order-id',requestId)}function closeModal(){$('#modal-root').innerHTML='';document.body.style.overflow=''}function modal(content,side=false){$('#modal-root').innerHTML='<div class="overlay '+(side?'side':'')+'" onclick="if(event.target===this)closeModal()"><section role="dialog" aria-modal="true" aria-label="'+(side?'Košík':'Detail')+'" class="modal '+(side?'drawer':'')+'"><button class="close" aria-label="Zavřít" onclick="closeModal()">×</button>'+content+'</section></div>';document.body.style.overflow='hidden';$('#modal-root .close').focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('#modal-root .modal')){const f=[...$('#modal-root').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled);const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
function shop(){closeModal();$('#app').innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Věci, které mají smysl</div><h1>Radost z maličkostí.<br><em>Každý den.</em></h1><p>Pečlivě vybrané kousky, které z obyčejného bydlení udělají váš domov.</p><a href="#produkty" class="primary">Prozkoumat produkty <span>↗</span></a></div><div class="hero-img"><img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1300&q=85" alt="Útulný přírodní interiér s jemnými doplňky"><div class="hero-label">${leaf}<div>Krásné. Jednoduché. Vaše.<small>Pro chvíle, kdy jste rádi doma.</small></div></div></div></section><div class="benefits"><span>${leaf} Vybráno s láskou a péčí</span><span>◇ &nbsp; Kousky pro každodenní radost</span><span>${bag} Platba pohodlně na dobírku</span></div><section id="produkty"><div class="section-head"><div><div class="eyebrow" style="margin-bottom:12px">Malé poklady pro váš domov</div><h2>Najděte si to své</h2><p class="sub">Méně věcí. Více těch, které si zamilujete.</p></div><span class="sub" id="product-count"></span></div><div class="controls"><div class="filters" id="filters"></div><div class="sort"><input class="search" aria-label="Hledat produkt" placeholder="Hledat…" oninput="query=this.value;renderProducts()"><select aria-label="Řadit produkty" onchange="sort=this.value;renderProducts()"><option value="default">Doporučené</option><option value="low">Od nejlevnějšího</option><option value="high">Od nejdražšího</option><option value="name">Podle názvu</option></select></div></div><div class="grid" id="grid"></div></section><section class="story" id="pribeh"><div><div class="eyebrow" style="margin-bottom:13px">Srdcem doma</div><h2>Domov tvoří maličkosti.</h2><p>Věříme v krásu jednoduchých věcí. V hrnek na oblíbenou kávu, jemné světlo svíčky a předměty, ke kterým se rádi vracíte. Vyberte si ty své.</p></div><span class="mark">d.</span></section><footer><a class="logo" href="#">doma<span>.</span></a><span>Malý obchod. Velká radost.</span><span>© ${new Date().getFullYear()} doma. · Ukázková kolekce</span><button onclick="showAdmin()">Správa obchodu ↗</button></footer>`;renderFilters();renderProducts();applyContent()}
function renderFilters(){$('#filters').innerHTML=['Vše',...new Set(products.map(p=>p.category).filter(Boolean))].map(c=>'<button class="chip '+(c===category?'selected':'')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join('');$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.category;renderFilters();renderProducts()})}
function renderProducts(){let p=products.filter(p=>(category==='Vše'||p.category===category)&&p.name.toLocaleLowerCase('cs').includes(query.toLocaleLowerCase('cs')));if(sort==='low')p.sort((a,b)=>a.price-b.price);if(sort==='high')p.sort((a,b)=>b.price-a.price);if(sort==='name')p.sort((a,b)=>a.name.localeCompare(b.name,'cs'));$('#product-count').textContent=p.length+' produktů';$('#grid').innerHTML=p.map(p=>`<article class="product"><button class="product-photo" data-detail="${esc(p.id)}" aria-label="Detail ${esc(p.name)}"><img src="${safeImg(p.image)}" alt="${esc(p.name)}" loading="lazy">${p.badge?'<span class="badge">'+esc(p.badge)+'</span>':''}</button><small>${esc(p.category||'Pro váš domov')}</small><h3><button data-detail="${esc(p.id)}" style="padding:0;text-align:left">${esc(p.name)}</button></h3><div class="product-bottom"><span class="price">${money(p.price)} <small>/ ${esc(p.unit||'ks')}</small></span><button class="add" data-add="${esc(p.id)}" aria-label="Přidat ${esc(p.name)} do košíku">${bag} Přidat do košíku</button></div></article>`).join('')||'<p class="empty">Žádné produkty neodpovídají vašemu výběru.</p>';$('#grid').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));$('#grid').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add))}
function safeImg(s){return /^(https:\/\/|data:image\/(png|jpeg|webp);base64,)/.test(s||'')?esc(s):'https://images.unsplash.com/photo-1493106641515-6b5631de4bb9?auto=format&fit=crop&w=800&q=80'}
function variants(p){return (p.variant||'').split(',').map(v=>v.trim()).filter(Boolean)}function add(id,v,qty=1){const p=products.find(p=>p.id===id);if(!p)return;v=v??variants(p)[0]??'';let item=cart.find(i=>i.id===id&&i.variant===v);if(item)item.qty=Math.min(999,item.qty+qty);else cart.push({id,variant:v,qty});saveCart();toast('Přidáno do košíku')}
function detail(id){const p=products.find(p=>p.id===id);const vs=variants(p);modal(`<div class="detail"><div><img id="detail-img" src="${safeImg(p.image)}" alt="${esc(p.name)}">${p.showGallery&&p.gallery?.length?'<div class="gallery">'+[p.image,...p.gallery].map(im=>'<button data-img="'+safeImg(im)+'"><img src="'+safeImg(im)+'" alt="Další fotografie"></button>').join('')+'</div>':''}</div><div><div class="eyebrow">${esc(p.category||'Pro váš domov')}</div><h2>${esc(p.name)}</h2><div class="price">${money(p.price)} / ${esc(p.unit||'ks')}</div>${p.showDescription&&p.description?'<p>'+esc(p.description).replace(/\n/g,'<br>')+'</p>':''}${vs.length?'<label class="field"><span>Vyberte variantu / množství balení</span><select id="variant">'+vs.map(v=>'<option>'+esc(v)+'</option>').join('')+'</select></label>':''}<label class="field"><span>Počet kusů</span><input id="detail-qty" type="number" min="1" max="999" value="1"></label><button class="primary full" id="detail-add">Přidat do košíku ${bag}</button><p class="note">${esc(content.shippingText||'Platba na dobírku při převzetí.')}</p></div></div>`);$('#detail-add').onclick=()=>{let q=Number($('#detail-qty').value);if(!Number.isInteger(q)||q<1||q>999)return toast('Zadejte počet od 1 do 999.');add(id,$('#variant')?.value||'',q)};document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>$('#detail-img').src=b.dataset.img)}
function cartTotal(){return cart.reduce((s,i)=>s+(products.find(p=>p.id===i.id)?.price||0)*i.qty,0)}function showCart(){const filtered=cart.filter(i=>products.some(p=>p.id===i.id));if(filtered.length!==cart.length){cart=filtered;saveCart()}modal('<h2>Váš košík <span class="sub">('+cart.reduce((n,i)=>n+i.qty,0)+')</span></h2>'+(cart.length?cart.map((i,k)=>{const p=products.find(p=>p.id===i.id);return `<div class="cart-item"><img src="${safeImg(p.image)}" alt="${esc(p.name)}"><div class="cart-info"><h3>${esc(p.name)}</h3><small>${esc(i.variant||p.unit||'ks')}</small><br><div class="quantity"><button aria-label="Snížit počet" onclick="changeQty(${k},-1)">−</button><span>${i.qty}</span><button aria-label="Zvýšit počet" onclick="changeQty(${k},1)">+</button></div><button class="remove" onclick="cart.splice(${k},1);saveCart();showCart()">Odebrat</button></div><span>${money(p.price*i.qty)}</span></div>`}).join('')+'<div class="total"><span>Celkem</span><strong>'+money(orderTotal())+'</strong></div><p class="note">'+esc(content.shippingText||'')+'<br>Doprava: '+money(content.shippingPrice||0)+' · Dobírka: '+money(content.codFee||0)+'</p><button class="primary full" onclick="checkout()">Pokračovat k platbě →</button>':'<div class="empty">'+bag+'<p>Váš košík čeká na první radost.</p><button class="primary" onclick="closeModal()">Zpět do obchodu</button></div>'),true)}function changeQty(k,d){cart[k].qty=Math.min(999,cart[k].qty+d);if(cart[k].qty<=0)cart.splice(k,1);saveCart();showCart()}
function checkout(){modal(`<button onclick="showCart()" class="note">← Zpět do košíku</button><h2 style="margin-top:20px">Dokončení objednávky</h2><div class="notice">◉ &nbsp; Dobírka · platíte až při převzetí<br><strong>Objednávka celkem: ${money(orderTotal())}</strong></div><form id="checkout"><label class="field"><span>Jméno a příjmení *</span><input name="name" required autocomplete="name" maxlength="200"></label><label class="field"><span>E-mail nebo telefon *</span><input name="contact" required autocomplete="email" maxlength="200"></label><label class="field"><span>Doručovací adresa včetně PSČ *</span><textarea name="address" required autocomplete="street-address" maxlength="500"></textarea></label><label class="field"><span>Poznámka (volitelné)</span><textarea name="note" maxlength="1000"></textarea></label><p class="note">${testMode?'Jde pouze o test. Nevzniká skutečná objednávka ani povinnost zaplatit.':'Odesláním objednáváte vybrané produkty s povinností zaplatit. Platba na dobírku při převzetí.'}</p>${content.terms?'<label class="note" style="display:block;margin-bottom:18px"><input type="checkbox" required> Souhlasím s <button type="button" class="remove" onclick="legalWindow(&quot;terms&quot;)">obchodními podmínkami</button>.</label>':''}<div id="order-error" class="error" role="alert"></div><button class="primary full" type="submit">Odeslat objednávku · ${money(orderTotal())}</button></form>`,true);if(currentUser)$('#checkout [name=contact]').value=currentUser.email;$('#checkout').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;b.textContent='Odesíláme…';try{const data=Object.fromEntries(new FormData(e.target));const r=await api('order',{...data,items:cart,requestId});cart=[];saveCart();modal('<div class="empty"><div style="font-size:48px;color:var(--green)">✓</div><h2>Děkujeme za objednávku</h2><p>Objednávka '+esc(r.id.slice(0,8))+(r.test?' byla uložena jako test. Neproběhne žádná platba ani doručení.</p>':' byla odeslána obchodu.</p><p>Brzy se vám ozveme s potvrzením.</p>')+'<button class="primary" onclick="closeModal()">Zpět do obchodu</button></div>')}catch(err){$('#order-error').textContent=err.message;b.disabled=false;b.textContent='Odeslat objednávku · '+money(orderTotal())}}}
async function showAdmin(){closeModal();try{adminData=await api('admin');content=adminData.content||content;adminView()}catch(e){showLogin(true)}}
function adminView(){$('#app').innerHTML=`<div class="admin-layout"><aside class="admin-nav"><h2>Váš obchod</h2><button class="${adminTab==='products'?'selected':''}" onclick="adminTab='products';adminView()">▦ &nbsp; Produkty</button><button class="${adminTab==='content'?'selected':''}" onclick="adminTab='content';adminView()">✎ &nbsp; Obsah a vzhled</button><button class="${adminTab==='orders'?'selected':''}" onclick="adminTab='orders';adminView()">▤ &nbsp; Objednávky</button><button class="${adminTab==='settings'?'selected':''}" onclick="adminTab='settings';adminView()">⚙ &nbsp; Nastavení</button><button onclick="shop()">← Zpět do obchodu</button></aside><section id="admin-content"></section></div>`;const a=$('#admin-content');if(adminTab==='products'){a.innerHTML='<div class="admin-title"><div><div class="eyebrow" style="margin-bottom:10px">Administrace</div><h1>Vaše produkty</h1></div><button class="primary" onclick="editProduct()">+ Přidat produkt</button></div><p class="notice">Produkty, kategorie, fotografie i ceny můžete kdykoli změnit. Prázdné a vypnuté sekce se zákazníkům nezobrazují.</p>'+products.map(p=>`<div class="admin-product"><img src="${safeImg(p.image)}" alt=""><div class="name"><h3>${esc(p.name)}</h3><small>${esc(p.category||'Bez kategorie')} · ${money(p.price)}</small></div><button class="secondary" data-edit="${esc(p.id)}">Upravit</button><button class="remove" data-delete="${esc(p.id)}">Smazat</button></div>`).join('');a.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));a.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete))}if(adminTab==='content')contentView(a);if(adminTab==='settings')settingsView(a);if(adminTab==='orders'){a.innerHTML='<div class="admin-title"><h1>Objednávky</h1><button class="secondary" onclick="showAdmin()">Obnovit</button></div>'+(adminData.orders?.length?adminData.orders.map(o=>`<article class="order-card"><strong>#${esc(o.id.slice(0,8))} · ${money(o.total)}</strong><label class="field"><span>Stav objednávky</span><select data-status="${esc(o.id)}">${['Nová','Potvrzená','Odeslaná','Dokončená','Zrušená'].map(v=>'<option '+(v===o.status?'selected':'')+'>'+v+'</option>').join('')}</select></label><span style="float:right" class="note">${new Date(o.date).toLocaleString('cs-CZ')}</span><p>${esc(o.name)}<br>${esc(o.contact)}<br>${esc(o.address)}</p>${o.items.map(i=>'<p>'+esc(i.name)+' '+esc(i.variant)+' × '+i.qty+' · '+money(i.price*i.qty)+'</p>').join('')}<p class="note">Dobírka · ${esc(o.note||'Bez poznámky')}</p></article>`).join(''):'<p class="empty">Zatím žádné objednávky.</p>');a.querySelectorAll('[data-status]').forEach(el=>el.onchange=async()=>{try{await api('admin/order-status',{id:el.dataset.status,status:el.value});const order=adminData.orders.find(o=>o.id===el.dataset.status);order.status=el.value;toast('Stav uložen')}catch(e){toast(e.message)}})}}
async function deleteProduct(id){const p=products.find(p=>p.id===id);modal('<h2>Smazat produkt?</h2><p>'+esc(p.name)+'</p><button class="primary" id="confirm-delete">Smazat produkt</button> <button class="secondary" onclick="closeModal()">Zrušit</button>');$('#confirm-delete').onclick=async()=>{try{let next=products.filter(p=>p.id!==id);await api('admin/products',next);products=next;closeModal();adminView();toast('Produkt smazán')}catch(e){toast(e.message)}}}
function editProduct(id){const p=products.find(p=>p.id===id)||{id:crypto.randomUUID(),price:0,showDescription:true,showGallery:true};modal(`<h2>${id?'Upravit produkt':'Nový produkt'}</h2><form id="product-form"><div class="row"><label class="field"><span>Název produktu *</span><input name="name" value="${esc(p.name||'')}" required maxlength="150"></label><label class="field"><span>Kategorie</span><input name="category" value="${esc(p.category||'')}"></label></div><div class="row"><label class="field"><span>Cena v Kč *</span><input name="price" type="number" min="0" step="0.01" value="${p.price}" required></label><label class="field"><span>Jednotka</span><input name="unit" value="${esc(p.unit||'ks')}" placeholder="ks, kg, balení"></label><label class="field"><span>Štítek</span><input name="badge" value="${esc(p.badge||'')}" placeholder="Novinka"></label></div><label class="field"><span>Hlavní obrázek — URL nebo nahrát fotografii</span><input name="image" id="image-url" value="${esc(p.image||'')}" placeholder="https://…"></label><input type="file" accept="image/png,image/jpeg,image/webp" id="main-file"><label class="field"><span>Varianty množství / balení (oddělené čárkou, stejná cena)</span><input name="variant" value="${esc(p.variant||'')}" placeholder="250 g, 500 g, 1 kg"></label><label class="field"><span>Popis (volitelné)</span><textarea name="description">${esc(p.description||'')}</textarea></label><label class="field"><span>Galerie — jedna URL fotografie na řádek</span><textarea name="gallery" id="gallery-urls">${esc((p.gallery||[]).join('\n'))}</textarea></label><input type="file" id="gallery-files" multiple accept="image/png,image/jpeg,image/webp"><div class="checks"><label><input name="showDescription" type="checkbox" ${p.showDescription?'checked':''}> Zobrazit popis</label><label><input name="showGallery" type="checkbox" ${p.showGallery?'checked':''}> Zobrazit galerii</label></div><p class="note">Pokud je popis nebo galerie prázdná, sekce se automaticky skryje.</p><p class="error" id="product-error"></p><button class="primary" type="submit">Uložit produkt</button></form>`);const imageFile=f=>new Promise((res,rej)=>{if(f.size>4000000)return rej(Error('Fotografie může mít maximálně 4 MB.'));const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,1200/img.width);canvas.width=img.width*scale;canvas.height=img.height*scale;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);res(canvas.toDataURL('image/jpeg',.8))};img.onerror=()=>rej(Error('Fotografii se nepodařilo načíst.'));img.src=url});$('#main-file').onchange=async e=>{try{if(e.target.files[0])$('#image-url').value=await imageFile(e.target.files[0])}catch(e){toast(e.message)}};$('#gallery-files').onchange=async e=>{try{const arr=await Promise.all([...e.target.files].slice(0,8).map(imageFile));$('#gallery-urls').value=[$('#gallery-urls').value,...arr].filter(Boolean).join('\n')}catch(e){toast(e.message)}};$('#product-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;const f=new FormData(e.target),n={id:p.id,name:f.get('name').trim(),category:f.get('category').trim(),price:Number(f.get('price')),unit:f.get('unit'),badge:f.get('badge'),image:f.get('image'),variant:f.get('variant'),description:f.get('description'),gallery:f.get('gallery').split('\n').map(s=>s.trim()).filter(Boolean),showDescription:f.has('showDescription'),showGallery:f.has('showGallery')};try{let next=id?products.map(x=>x.id===id?n:x):[...products,n];await api('admin/products',next);products=next;closeModal();adminView();toast('Produkt uložen')}catch(e){$('#product-error').textContent=e.message;b.disabled=false}}}
function settingsView(a){const s=adminData.settings||{};a.innerHTML=`<div class="admin-title"><h1>Nastavení obchodu</h1></div><div class="notice">${s.emailReady?'✓ Odesílací služba je připojena.':'Připojte Resend, aby zákazníci mohli odesílat objednávky.'}</div><form id="settings-form" style="max-width:600px"><label class="field"><span>E-mail pro příjem objednávek *</span><input name="email" type="email" value="${esc(s.email)}" required placeholder="objednavky@vas-obchod.cz"></label><label class="field"><span>Odesílací adresa ověřená v Resend *</span><input name="from" type="email" value="${esc(s.from)}" required placeholder="obchod@vase-domena.cz"></label><label class="field"><span>Resend API klíč ${s.emailReady?'(ponechte prázdné pro zachování)':'*'}</span><input name="key" type="password" autocomplete="new-password" placeholder="re_…" ${s.emailReady?'':'required'}></label><p class="note">Klíč se ukládá pouze na serveru a při dalším otevření se nezobrazuje. Každá objednávka odešle souhrn na nastavenou adresu. Bez úspěšného odeslání se košík nevyprázdní.</p><p class="error" id="settings-error"></p><button class="primary" type="submit">Uložit nastavení</button></form>`;$('#settings-form').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{await api('admin/settings',Object.fromEntries(new FormData(e.target)));toast('Nastavení uloženo');await showAdmin()}catch(e){$('#settings-error').textContent=e.message;b.disabled=false}}}
async function init(){try{const d=await api('catalog');products=d.products;content=d.content||{};currentUser=d.user;testMode=!!d.testMode;isAdmin=d.admin;$('#count').textContent=cart.reduce((n,i)=>n+i.qty,0);applyHeader();shop();if(location.hash.startsWith('#setup='))setupAdmin(location.hash.slice(7));else if(location.hash.startsWith('#login='))verifyLogin(location.hash.slice(7));else if(location.pathname==='/admin')showAdmin()}catch(e){$('#app').innerHTML='<div class="empty"><h2>Obchod se připravuje</h2><p>'+esc(e.message)+'</p><button class="primary" onclick="init()">Zkusit znovu</button></div>'}}function orderTotal(){return Math.round((cartTotal()+(content.shippingPrice||0)+(content.codFee||0))*100)/100}
function applyHeader(){document.title=content.pageTitle||content.brand||'Obchod';document.querySelectorAll('.logo').forEach(el=>el.textContent=content.brand||'Obchod');const b=$('header .admin-link');if(b){b.textContent=currentUser?'Můj účet':'Přihlášení';b.onclick=showAccount}let admin=$('#admin-top');if(isAdmin&&!admin){admin=document.createElement('button');admin.id='admin-top';admin.textContent='Administrace';admin.onclick=showAdmin;$('.head-actions').prepend(admin)}else if(!isAdmin&&admin)admin.remove()}

nt[key]).map(([key,label])=>'<button data-legal="'+key+'">'+label+'</button>').join('')+'<a href="/admin">Správa obchodu</a></div>';footer.querySelectorAll('[data-legal]').forEach(b=>b.onclick=()=>legalWindow(b.dataset.legal));}
function legalWindow(key){const popup=window.open('','_blank');if(!popup)return toast('Povolte otevření nového okna pro tento dokument.');popup.document.write('<!doctype html><html lang="cs"><meta charset="utf-8"><title>'+esc(content.brand||'Obchod')+'</title><body style="max-width:760px;margin:50px auto;padding:20px;font:16px/1.8 sans-serif"><h1>'+esc({terms:'Obchodní podmínky',privacy:'Ochrana soukromí',contact:'Kontakt'}[key])+'</h1><div style="white-space:pre-wrap">'+esc(content[key]||'')+'</div></body></html>');popup.document.close();popup.opener=null}

['Kontakt a dokumenty',[['contact','Kontaktní údaje prodejce','textarea'],['terms','Obchodní podmínky','textarea'],['privacy','Ochrana osobních údajů','textarea']]]];
function contentView(a){a.innerHTML='<div class="admin-title"><h1>Obsah a vzhled</h1></div><p class="notice">Upravte obsah celého obchodu. Vypnuté sekce a prázdné dokumenty se zákazníkům nezobrazují. Ceny dopravy se započítají do objednávky.</p><form id="content-form">'+contentFields.map(([title,fields])=>'<details open style="border-bottom:1px solid var(--line);padding:20px 0"><summary style="cursor:pointer;font-size:18px">'+title+'</summary>'+fields.map(([key,label,type='text'])=>type==='checkbox'?'<label class="field"><input type="checkbox" name="'+key+'" '+(content[key]?'checked':'')+'> '+esc(label)+'</label>':'<label class="field"><span>'+esc(label)+'</span>'+(type==='textarea'?'<textarea name="'+key+'" style="min-height:120px">'+esc(content[key]||'')+'</textarea>':'<input name="'+key+'" type="'+type+'" '+(type==='number'?'min="0" max="100000" step="0.01"':'')+' value="'+esc(content[key]??'')+'">')+'</label>').join('')+'</details>').join('')+'<p id="content-error" class="error"></p><button class="primary" type="submit" style="margin-top:20px">Uložit obsah a vzhled</button></form>';$('#content-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;const f=new FormData(e.target),next={};for(const [,fields] of contentFields)for(const [key,,type] of fields)next[key]=type==='checkbox'?f.has(key):type==='number'?Number(f.get(key)):f.get(key);try{await api('admin/content',next);content=next;adminData.content=next;applyHeader();toast('Obsah uložen. Změny jsou v obchodě.')}catch(e){$('#content-error').textContent=e.message}finally{b.disabled=false}}}
function showLogin(forAdmin=false){modal('<h2>'+ (forAdmin?'Přihlášení správce':'Váš zákaznický účet')+'</h2><p class="notice">'+(forAdmin?'Přihlaste se e-mailem nastaveným pro správce obchodu.':'Pošleme vám jednorázový odkaz. Při prvním přihlášení vám vytvoříme účet — bez hesla.')+'</p><form id="login-form"><label class="field"><span>E-mail</span><input type="email" name="email" required autocomplete="email"></label><p class="error" id="login-error" role="alert"></p><button class="primary full" type="submit">Poslat přihlašovací odkaz</button></form><p class="note">Nakoupit můžete i bez registrace.</p>'+(forAdmin?'<button type="button" class="secondary" onclick="adminPasswordLogin()">Přihlásit správce heslem</button>':''));$('#login-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('auth/request',{email:new FormData(e.target).get('email')});modal('<h2>Zkontrolujte svůj e-mail</h2><p class="notice">Otevřete odkaz v e-mailu. Platí 15 minut a lze jej použít jen jednou.</p><button class="primary" onclick="closeModal()">Pokračovat v obchodě</button>')}catch(err){$('#login-error').textContent=err.message;b.disabled=false}}}
async function verifyLogin(token){history.replaceState(null,'',location.pathname);modal('<h2>Ověřit přihlášení</h2><p>Kliknutím dokončíte přihlášení k e-mailu, na který jsme poslali tento odkaz.</p><p id="verify-error" class="error"></p><button class="primary" id="verify-btn">Přihlásit se</button>');$('#verify-btn').onclick=async e=>{e.target.disabled=true;try{await api('auth/verify',{token});closeModal();await init();toast('Jste přihlášeni')}catch(err){$('#verify-error').textContent=err.message;e.target.disabled=false}}}
async function showAccount(){if(!currentUser)return showLogin();try{const a=await api('account');modal('<h2>Můj účet</h2><p>'+esc(a.email)+'</p><button class="secondary" id="logout">Odhlásit se</button><h3 style="margin-top:30px">Moje objednávky</h3>'+(a.orders.length?a.orders.map(o=>'<div class="order-card"><strong>#'+esc(o.id.slice(0,8))+' · '+money(o.total)+'</strong><p>'+esc(o.status)+' · '+new Date(o.date).toLocaleDateString('cs-CZ')+'</p>'+o.items.map(i=>'<p>'+esc(i.name)+' × '+i.qty+'</p>').join('')+'</div>').join(''):'<p class="note">Zatím tu nejsou žádné objednávky vytvořené pod tímto účtem.</p>'));$('#logout').onclick=async()=>{await api('auth/logout',{});currentUser=null;isAdmin=false;closeModal();await init();toast('Jste odhlášeni')}}catch(e){toast(e.message)}}

function setupAdmin(token){history.replaceState(null,'',location.pathname);modal('<h2>První nastavení správce</h2><p class="notice">Nastavte vlastní heslo správce (alespoň 12 znaků). Odkaz lze použít jen jednou.</p><form id="setup-form"><label class="field"><span>Nové heslo správce</span><input name="password" type="password" minlength="12" maxlength="200" required autocomplete="new-password"></label><label class="field"><span>Heslo znovu</span><input name="confirm" type="password" required autocomplete="new-password"></label><p class="error" id="setup-error"></p><button class="primary full" type="submit">Nastavit heslo a otevřít administraci</button></form>');$('#setup-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('password')!==f.get('confirm'))return $('#setup-error').textContent='Hesla se neshodují.';const b=e.target.querySelector('button');b.disabled=true;try{await api('auth/setup',{token,password:f.get('password')});closeModal();await init();await showAdmin()}catch(err){$('#setup-error').textContent=err.message;b.disabled=false}}}
function adminPasswordLogin(){modal('<h2>Přihlášení správce</h2><form id="password-form"><label class="field"><span>E-mail správce</span><input name="email" type="email" autocomplete="username" required></label><label class="field"><span>Heslo</span><input name="password" type="password" autocomplete="current-password" required></label><p class="error" id="password-error"></p><button type="submit" class="primary full">Přihlásit se</button></form>');$('#password-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('auth/password',Object.fromEntries(new FormData(e.target)));closeModal();await init();await showAdmin()}catch(err){$('#password-error').textContent=err.message;b.disabled=false}}}

init();
</script></body></html>
